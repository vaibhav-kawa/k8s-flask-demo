apiVersion: v1
kind: Service
metadata:
  name: flask-demo-service
spec:
  type: NodePort                   # exposes the app outside the cluster
  selector:
    app: flask-demo                # routes to pods with this label
  ports:
    - port: 80                     # service port inside the cluster
      targetPort: 5000             # container port
      nodePort: 30080              # port opened on the node
